name: Mirror Release

on:
  repository_dispatch:
    types: [child-release-created]

permissions:
  contents: write

jobs:
  mirror-release:
    name: Mirror Release Assets
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.info.outputs.tag }}
      version: ${{ steps.info.outputs.version }}
    steps:
      - name: Extract release info
        id: info
        env:
          TAG: ${{ github.event.client_payload.tag }}
        run: |
          # Later steps paste this tag into their scripts: refuse anything but a release tag.
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::client_payload.tag must be vMAJOR.MINOR.PATCH[-pre], got '${TAG}'"
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # gitkb/gitkb-core is private: the dependency-updates App's token, contents read on it alone.
      - name: Token to read gitkb/gitkb-core
        id: core-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DEPENDENCY_UPDATES_APP_ID }}
          private-key: ${{ secrets.DEPENDENCY_UPDATES_APP_KEY }}
          owner: gitkb
          repositories: gitkb-core
          permission-contents: read

      - name: Download assets from private release
        env:
          GH_TOKEN: ${{ steps.core-token.outputs.token }}
        run: |
          mkdir -p release
          gh release download "${{ steps.info.outputs.tag }}" \
            --repo gitkb/gitkb-core \
            --pattern "*.tar.gz" \
            --pattern "*.sha256" \
            --pattern "checksums.txt" \
            --dir release

      - name: Create public release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.info.outputs.tag }}
          name: ${{ steps.info.outputs.tag }}
          body: |
            GitKB ${{ steps.info.outputs.tag }}

            Install via:
            ```bash
            curl -fsSL https://raw.githubusercontent.com/gitkb/gitkb-releases/main/install.sh | bash
            ```

            Or via Homebrew:
            ```bash
            brew install gitkb/tap/gitkb
            ```
          files: release/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Dependents that pin git-kb's releases from here get dep-update with this
  # version once the public release and its assets exist. This repo is public
  # and can't call the private gitkb/workflows, so it sends the dispatch
  # itself: one per dependent that gitkb/workflows' dependents.yml lists with a
  # release-pin entry for gitkb-releases. Keep the two in step; its daily check
  # fails when a listed one is missing here. Only this repo, and only a
  # published release.
  notify-release-pins:
    name: Notify release pins
    needs: mirror-release
    if: github.repository == 'gitkb/gitkb-releases'
    runs-on: ubuntu-latest
    # GITHUB_TOKEN reads this repo's release and tag; the App's token sends the dispatch.
    permissions:
      contents: read
    steps:
      # A dispatch needs contents write, on gitkb/atc-sandbox alone.
      - name: Token to dispatch to atc-sandbox
        id: dispatch-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DEPENDENCY_UPDATES_APP_ID }}
          private-key: ${{ secrets.DEPENDENCY_UPDATES_APP_KEY }}
          owner: gitkb
          repositories: atc-sandbox
          permission-contents: write

      - name: Send dep-update with the version
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_TOKEN: ${{ steps.dispatch-token.outputs.token }}
          TAG: ${{ needs.mirror-release.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::${TAG} isn't vMAJOR.MINOR.PATCH; release pins take only those, so nothing is sent."
            exit 0
          fi
          # The release's real state, not its tag's shape: a v1.2.3 can be a draft or marked prerelease.
          state="$(gh api "repos/${REPO}/releases/tags/${TAG}" --jq 'if .draft then "draft" elif .prerelease then "prerelease" else "published" end')"
          if [[ "$state" != published ]]; then
            echo "::notice::${TAG} is a ${state} release; release pins move only to published ones, so nothing is sent."
            exit 0
          fi
          sha="$(gh api "repos/${REPO}/commits/${TAG}" --jq .sha)"
          payload="$(jq -n --arg repo "$REPO" --arg sha "$sha" --arg version "${TAG#v}" \
            '{event_type: "dep-update", client_payload: {repo: $repo, sha: $sha, version: $version}}')"
          GH_TOKEN="$DISPATCH_TOKEN" gh api --method POST repos/gitkb/atc-sandbox/dispatches --input - <<<"$payload" >/dev/null
          echo "Sent dep-update ${REPO} ${TAG} to gitkb/atc-sandbox"

  notify-discord:
    name: Notify Discord
    needs: mirror-release
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check webhook configured
        id: check
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_RELEASES_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Discord webhook not configured, skipping notification"
          fi

      - name: Post to Discord
        if: steps.check.outputs.skip != 'true'
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_RELEASES_WEBHOOK_URL }}
        run: |
          TAG="${{ needs.mirror-release.outputs.tag }}"

          # Build JSON payload with jq to handle escaping
          PAYLOAD=$(jq -n \
            --arg title "GitKB $TAG Released" \
            --arg desc "A new version of GitKB is available." \
            --arg install_sh 'curl -fsSL https://raw.githubusercontent.com/gitkb/gitkb-releases/main/install.sh | bash' \
            --arg install_brew 'brew install gitkb/tap/gitkb' \
            --arg url "https://github.com/gitkb/gitkb-releases/releases/tag/$TAG" \
            '{
              embeds: [{
                title: $title,
                url: $url,
                description: $desc,
                color: 3066993,
                fields: [
                  {
                    name: "Install via Shell",
                    value: ("```sh\n" + $install_sh + "\n```")
                  },
                  {
                    name: "Install via Homebrew",
                    value: ("```sh\n" + $install_brew + "\n```")
                  }
                ]
              }]
            }')

          # Post to Discord webhook
          HTTP_STATUS=$(curl -s -o /tmp/discord_response.txt -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$WEBHOOK_URL")

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Discord notification sent successfully (HTTP $HTTP_STATUS)"
          else
            echo "::warning::Discord notification failed (HTTP $HTTP_STATUS)"
            cat /tmp/discord_response.txt
            exit 1
          fi

  update-homebrew:
    name: Update Homebrew Formula
    needs: mirror-release
    runs-on: ubuntu-latest
    # Only update on non-prerelease tags
    if: ${{ !contains(github.event.client_payload.tag, '-') }}
    steps:
      - name: Extract version
        id: version
        env:
          TAG: ${{ github.event.client_payload.tag }}
        run: |
          # Later steps paste this tag into their scripts: refuse anything but a release tag.
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::client_payload.tag must be vMAJOR.MINOR.PATCH[-pre], got '${TAG}'"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # gitkb/gitkb-core is private: the dependency-updates App's token, contents read on it alone.
      - name: Token to read gitkb/gitkb-core
        id: core-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DEPENDENCY_UPDATES_APP_ID }}
          private-key: ${{ secrets.DEPENDENCY_UPDATES_APP_KEY }}
          owner: gitkb
          repositories: gitkb-core
          permission-contents: read

      - name: Download checksum files
        env:
          GH_TOKEN: ${{ steps.core-token.outputs.token }}
          TAG: ${{ github.event.client_payload.tag }}
        run: |
          mkdir -p checksums
          gh release download "$TAG" \
            --repo gitkb/gitkb-core \
            --pattern "*.sha256" \
            --dir checksums

      # git-kb and each extension (`git-kb <name>` runs `git-kb-<name>`), one
      # archive per platform; the extensions are resources of the one formula.
      - name: Generate Homebrew formula
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          sha() {
            local file="checksums/$1.sha256"
            if [ ! -f "$file" ]; then
              echo "::error::the release has no $1" >&2
              exit 1
            fi
            local digest
            digest=$(awk 'NR == 1 {print $1}' "$file")
            if [[ ! "$digest" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::$file holds no SHA-256 digest" >&2
              exit 1
            fi
            echo "$digest"
          }
          # Releases from 1.0.0 ship the extensions; earlier ones have code
          # intelligence built into git-kb and a core-only formula.
          extensions=""
          if [ "${VERSION%%.*}" -ge 1 ]; then
            extensions="code semantic"
          fi
          platform_block() {
            local platform="$1"
            # The shell's version, not Ruby's `#{version}`: inside a resource
            # block that names the resource's version, which is unset.
            local base="https://github.com/gitkb/gitkb-releases/releases/download/v${VERSION}"
            local sum
            sum=$(sha "gitkb-${platform}.tar.gz")
            echo "      url \"${base}/gitkb-${platform}.tar.gz\""
            echo "      sha256 \"${sum}\""
            for ext in $extensions; do
              sum=$(sha "gitkb-${ext}-${platform}.tar.gz")
              echo ""
              echo "      resource \"git-kb-${ext}\" do"
              echo "        url \"${base}/gitkb-${ext}-${platform}.tar.gz\""
              echo "        sha256 \"${sum}\""
              echo "      end"
            done
          }
          {
            echo '# typed: false'
            echo '# frozen_string_literal: true'
            echo ''
            echo 'class Gitkb < Formula'
            echo '  desc "Git-native knowledge base with AI-powered code intelligence"'
            echo '  homepage "https://github.com/gitkb/gitkb-releases"'
            echo "  version \"${VERSION}\""
            echo '  license "MIT"'
            echo ''
            echo '  on_macos do'
            echo '    on_arm do'
            platform_block darwin-arm64
            echo '    end'
            echo '    on_intel do'
            platform_block darwin-x64
            echo '    end'
            echo '  end'
            echo ''
            echo '  on_linux do'
            echo '    on_arm do'
            platform_block linux-arm64
            echo '    end'
            echo '    on_intel do'
            platform_block linux-x64
            echo '    end'
            echo '  end'
            echo ''
            echo '  def install'
            echo '    bin.install "git-kb"'
            if [ -n "$extensions" ]; then
              echo '    %w[git-kb-code git-kb-semantic].each do |name|'
              echo '      resource(name).stage { bin.install name }'
              echo '    end'
            fi
            echo '  end'
            echo ''
            echo '  test do'
            echo '    system "#{bin}/git-kb", "--version"'
            for ext in $extensions; do
              echo "    system \"#{bin}/git-kb-${ext}\", \"--version\""
            done
            echo '  end'
            echo 'end'
          } > gitkb.rb
          cat gitkb.rb

      - name: Token to update gitkb/homebrew-tap
        id: tap-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.DEPENDENCY_UPDATES_APP_ID }}
          private-key: ${{ secrets.DEPENDENCY_UPDATES_APP_KEY }}
          owner: gitkb
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write
          # To wait for the tap's formula-test run before merging.
          permission-actions: read

      - name: Push to Homebrew tap
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BRANCH="update-gitkb-${VERSION}"

          gh auth setup-git
          gh repo clone gitkb/homebrew-tap tap
          mkdir -p tap/Formula
          cp gitkb.rb tap/Formula/
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/gitkb.rb
          if ! git diff --cached --quiet; then
            git checkout -b "$BRANCH"
            git commit -m "Update gitkb to v${VERSION}"
            # Force push in case branch exists from a previous failed run
            git push -f -u origin "$BRANCH"
            # Create PR only if one doesn't already exist
            if ! gh pr view "$BRANCH" --repo gitkb/homebrew-tap &>/dev/null; then
              gh pr create \
                --title "Update gitkb to v${VERSION}" \
                --body "Automated formula update from gitkb-core release v${VERSION}." \
                --repo gitkb/homebrew-tap
            fi
            # The tap requires no status check, so wait here for its
            # formula-test run (install, `brew test`, `--version`) on this
            # exact commit, and merge only that commit once it passes.
            head="$(git rev-parse HEAD)"
            run_id=""
            for _ in $(seq 1 60); do
              run_id="$(gh run list --repo gitkb/homebrew-tap --workflow formula-test.yml \
                --branch "$BRANCH" --json databaseId,headSha \
                -q "map(select(.headSha == \"$head\")) | first | .databaseId // empty")"
              [ -n "$run_id" ] && break
              sleep 10
            done
            if [ -z "$run_id" ]; then
              echo "::error::formula-test did not start for $head on gitkb/homebrew-tap"
              exit 1
            fi
            gh run watch "$run_id" --repo gitkb/homebrew-tap --exit-status
            gh pr merge "$BRANCH" \
              --squash \
              --match-head-commit "$head" \
              --repo gitkb/homebrew-tap
          else
            echo "Formula unchanged, skipping commit"
          fi
