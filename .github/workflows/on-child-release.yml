name: Mirror Release

on:
  repository_dispatch:
    types: [child-release-created]

permissions:
  contents: write

jobs:
  mirror-release:
    name: Mirror Release Assets
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.info.outputs.tag }}
      version: ${{ steps.info.outputs.version }}
      prerelease: ${{ steps.info.outputs.prerelease }}
      channel: ${{ steps.info.outputs.channel }}
    steps:
      - name: Extract release info
        id: info
        run: |
          set -euo pipefail

          TAG="$(jq -r '.client_payload.tag // ""' "$GITHUB_EVENT_PATH")"
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            CHANNEL=stable
            PRERELEASE=false
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+\.[0-9]+\.[0-9a-f]{7,40}$ ]]; then
            CHANNEL=alpha
            PRERELEASE=true
          else
            echo "::error::Unsupported release tag: $TAG"
            exit 1
          fi

          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Download assets from private release
        env:
          GH_TOKEN: ${{ secrets.CORE_REPO_PAT }}
          TAG: ${{ steps.info.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release
          gh release download "$TAG" \
            --repo gitkb/gitkb-core \
            --pattern "*.tar.gz" \
            --pattern "*.sha256" \
            --pattern "checksums.txt" \
            --dir release

      - name: Write release body
        env:
          PRERELEASE: ${{ steps.info.outputs.prerelease }}
          TAG: ${{ steps.info.outputs.tag }}
          VERSION: ${{ steps.info.outputs.version }}
        run: |
          set -euo pipefail

          if [ "$PRERELEASE" = "true" ]; then
            {
              echo "GitKB ${TAG} pre-release"
              echo
              echo "Install the alpha channel via Homebrew:"
              echo '```bash'
              echo "brew install gitkb/tap/gitkb-alpha"
              echo '```'
              echo
              echo "Or install this exact version via shell:"
              echo '```bash'
              echo "curl -fsSL https://raw.githubusercontent.com/gitkb/gitkb-releases/main/install.sh | env VERSION=${VERSION} bash"
              echo '```'
            } > release-body.md
          else
            {
              echo "GitKB ${TAG}"
              echo
              echo "Install via:"
              echo '```bash'
              echo "curl -fsSL https://raw.githubusercontent.com/gitkb/gitkb-releases/main/install.sh | bash"
              echo '```'
              echo
              echo "Or via Homebrew:"
              echo '```bash'
              echo "brew install gitkb/tap/gitkb"
              echo '```'
            } > release-body.md
          fi

      - name: Create public release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.info.outputs.tag }}
          name: ${{ steps.info.outputs.tag }}
          body_path: release-body.md
          prerelease: ${{ steps.info.outputs.prerelease }}
          files: release/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-discord:
    name: Notify Discord
    needs: mirror-release
    runs-on: ubuntu-latest
    if: needs.mirror-release.outputs.prerelease != 'true'
    continue-on-error: true
    steps:
      - name: Check webhook configured
        id: check
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_RELEASES_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Discord webhook not configured, skipping notification"
          fi

      - name: Post to Discord
        if: steps.check.outputs.skip != 'true'
        env:
          TAG: ${{ needs.mirror-release.outputs.tag }}
          WEBHOOK_URL: ${{ secrets.DISCORD_RELEASES_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          # Build JSON payload with jq to handle escaping
          PAYLOAD=$(jq -n \
            --arg title "GitKB $TAG Released" \
            --arg desc "A new version of GitKB is available." \
            --arg install_sh 'curl -fsSL https://raw.githubusercontent.com/gitkb/gitkb-releases/main/install.sh | sh' \
            --arg install_brew 'brew install gitkb/tap/gitkb' \
            --arg url "https://github.com/gitkb/gitkb-releases/releases/tag/$TAG" \
            '{
              embeds: [{
                title: $title,
                url: $url,
                description: $desc,
                color: 3066993,
                fields: [
                  {
                    name: "Install via Shell",
                    value: ("```sh\n" + $install_sh + "\n```")
                  },
                  {
                    name: "Install via Homebrew",
                    value: ("```sh\n" + $install_brew + "\n```")
                  }
                ]
              }]
            }')

          # Post to Discord webhook
          HTTP_STATUS=$(curl -s -o /tmp/discord_response.txt -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$WEBHOOK_URL")

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Discord notification sent successfully (HTTP $HTTP_STATUS)"
          else
            echo "::warning::Discord notification failed (HTTP $HTTP_STATUS)"
            cat /tmp/discord_response.txt
            exit 1
          fi

  update-homebrew:
    name: Update Homebrew Formula
    needs: mirror-release
    runs-on: ubuntu-latest
    if: needs.mirror-release.outputs.channel == 'stable'
    steps:
      - name: Dispatch Homebrew tap update
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          repository: gitkb/homebrew-tap
          event-type: gitkb-formula-update
          client-payload: >-
            {
              "channel": "stable",
              "tag": "${{ needs.mirror-release.outputs.tag }}"
            }

  update-homebrew-alpha:
    name: Update Homebrew Alpha Formula
    needs: mirror-release
    runs-on: ubuntu-latest
    if: needs.mirror-release.outputs.channel == 'alpha'
    steps:
      - name: Dispatch Homebrew alpha tap update
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4
        with:
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          repository: gitkb/homebrew-tap
          event-type: gitkb-formula-update
          client-payload: >-
            {
              "channel": "alpha",
              "tag": "${{ needs.mirror-release.outputs.tag }}"
            }
